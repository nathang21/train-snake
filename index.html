<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Train Snake — 2 Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train Snake">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --p1:#ff5252; --p1d:#c62828;
    --p2:#40c4ff; --p2d:#0277bd;
    --bg1:#1a2a3a; --bg2:#0d1620;
    --gold:#ffd740;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* solid colour after the gradient fills the iOS safe-area canvas (no white strip) */
    background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2)) no-repeat var(--bg2); color:#fff; user-select:none;}
  html{background:var(--bg2);}
  @keyframes rbslide{0%{background-position:0% 50%}100%{background-position:100% 50%}}
  body.rainbow{ background:linear-gradient(45deg,#ff004c,#ff8a00,#ffee00,#00d26a,#00b7ff,#a259ff,#ff004c);
    background-size:400% 400%; animation:rbslide 7s linear infinite; }
  #wrap{display:flex; flex-direction:column; align-items:center; height:100%; gap:8px;
    padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));}
  /* slim top bar */
  #bar{display:flex; align-items:center; justify-content:space-between; width:100%; max-width:680px; gap:10px; flex:none;}
  #gear{border:none; background:rgba(255,255,255,.10); color:#fff; font-size:20px; width:44px; height:44px;
    border-radius:12px; cursor:pointer; line-height:1;} #gear:active{transform:scale(.92);}
  #scores{display:flex; gap:16px; font-size:clamp(16px,3.6vw,26px); font-weight:800; letter-spacing:1px;}
  .s1{color:var(--p1); text-shadow:0 2px 0 var(--p1d);}
  .s2{color:var(--p2); text-shadow:0 2px 0 var(--p2d);}
  .bar-title{font-size:clamp(13px,2.8vw,18px); font-weight:900; letter-spacing:1px; white-space:nowrap;
    background:linear-gradient(90deg,var(--p1),var(--gold),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  /* stage centres the board in the space left after the bar + reserved pad zones */
  #stage{flex:1; width:100%; min-height:0; display:flex; align-items:center; justify-content:center;}
  #board-holder{position:relative; display:inline-block; line-height:0;}
  /* square board — no CSS corner clipping (iOS WebKit mis-clips a continuously-redrawn canvas) */
  #board{display:block; background:#0f1d2b; touch-action:none;
    box-shadow:0 12px 40px rgba(0,0,0,.6), inset 0 0 0 4px rgba(255,255,255,.08);}
  /* countdown crossing gate — DOM/CSS (canvas animation ghosts on iOS) */
  #count{position:absolute; inset:0; display:none; overflow:hidden; pointer-events:none; z-index:4;}
  #count.show{display:block;}
  #count-gate{position:absolute; left:5%; top:46.5%; width:90%; height:7%; transform-origin:left center;
    transform:rotate(-90deg); transition:transform .5s cubic-bezier(.5,0,.35,1); box-sizing:border-box;
    background:repeating-linear-gradient(90deg,#e53935 0 11.11%,#f5f5f5 11.11% 22.22%);
    border:1px solid rgba(0,0,0,.45); border-radius:3px;}
  #count.closed #count-gate{transform:rotate(0deg);}
  #count-post{position:absolute; left:3.6%; top:50%; width:2.8%; height:46%; background:#3a3a3a;}
  #count-post::after{content:''; position:absolute; left:-45%; bottom:0; width:190%; height:13%; background:#2a2a2a;}
  .glight{position:absolute; top:56%; width:3.4%; aspect-ratio:1; border-radius:50%;}
  #gl1{left:2%; animation:cblink .56s steps(1,end) infinite;}
  #gl2{left:6.2%; animation:cblink .56s steps(1,end) infinite; animation-delay:.28s;}
  @keyframes cblink{0%,49.9%{background:#ff1744}50%,100%{background:#4a0000}}
  #count-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1;
    font-size:14vmin; font-weight:900; color:#fff; -webkit-text-stroke:6px #10151c; paint-order:stroke fill;
    text-shadow:0 3px 5px rgba(0,0,0,.45);}   /* crisp outline, no blur smearing onto the gate */
  #count-num.pop{animation:cpop .42s ease-out;}
  @keyframes cpop{0%{transform:scale(.4);opacity:0}45%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  /* touch pads */
  .pad{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); width:186px; height:186px; display:none; touch-action:none; z-index:5;}
  #pad1{left:calc(16px + env(safe-area-inset-left));} #pad2{right:calc(16px + env(safe-area-inset-right));}
  .pad button{position:absolute; width:62px; height:62px; border:none; border-radius:18px; font-size:28px; font-weight:900;
    color:#fff; opacity:.92; box-shadow:0 3px 8px rgba(0,0,0,.4); transition:transform .05s;}
  .pad button:active{transform:scale(.88); opacity:1;}
  #pad1 button{background:var(--p1d);} #pad2 button{background:var(--p2d);}
  .up{top:0; left:62px;} .down{bottom:0; left:62px;} .left{top:62px; left:0;} .right{top:62px; right:0;}
  @media (pointer:coarse){ .pad{display:block;} }
  /* reserve real layout space so the board can never sit under the pads */
  @media (pointer:coarse) and (orientation:portrait){ #wrap{padding-bottom:calc(214px + env(safe-area-inset-bottom));} }
  @media (pointer:coarse) and (orientation:landscape){
    #wrap{padding-left:calc(196px + env(safe-area-inset-left)); padding-right:calc(196px + env(safe-area-inset-right));} }
  @media (orientation:landscape){ .pad{bottom:auto; top:50%; transform:translateY(-50%);} }
  /* single-player: centre the lone D-pad instead of parking it in the corner */
  @media (orientation:portrait){ body.one #pad1{left:50%; right:auto; transform:translateX(-50%);} }
  #flash{position:fixed; inset:0; pointer-events:none; opacity:0; background:#fff; transition:opacity .25s; z-index:6;}
  /* settings modal + game-over overlay */
  #modal,#over{position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); backdrop-filter:blur(3px); padding:16px;}
  #modal.open,#over.open{display:flex;}
  #over{z-index:11;}
  #modal{z-index:12;}   /* settings sits above the game-over overlay so it's reachable when paused */
  .sheet{background:#14263a; border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:20px;
    width:100%; max-width:360px; max-height:calc(100dvh - 32px); overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .sheet h2{margin:0 0 4px; font-size:22px;
    background:linear-gradient(90deg,var(--p1),var(--gold),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sheet .sub{margin:0 0 14px; font-size:13px; line-height:1.4; opacity:.7;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0;}
  .row > span{font-size:15px; font-weight:700; opacity:.9;}
  .grp{display:flex; gap:4px; background:rgba(0,0,0,.25); padding:4px; border-radius:12px;}
  .row.col{flex-direction:column; align-items:stretch; gap:8px;}
  .grp.wrap{flex-wrap:wrap;}
  .grp.wrap button{flex:1 1 calc(20% - 5px); min-width:0; padding:9px 4px;} /* 5 per row */
  .grp button, .tog{border:none; background:rgba(255,255,255,.10); color:#fff; font-size:15px; font-weight:700;
    padding:9px 13px; border-radius:9px; cursor:pointer; line-height:1; min-height:42px;}
  .grp button.on, .tog.on{background:var(--gold); color:#14263a;}
  .tog{min-width:66px;}
  #close,#restart{margin-top:16px; width:100%; border:none; border-radius:12px; padding:14px; font-size:17px; font-weight:900;
    color:#14263a; background:var(--gold); cursor:pointer;}
  /* colour swatches */
  .grp.wrap .sw{flex:1 1 calc(20% - 4px); height:38px; min-height:38px; padding:0; border:2px solid rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;}
  .grp.wrap .sw.on{outline:3px solid var(--gold); outline-offset:1px;}  /* gold ring shows on any colour, incl. white/black */
  #over .sheet{text-align:center;}
  #over-score{font-size:26px; font-weight:900; margin:6px 0 2px;}
  #over-best{font-size:15px; font-weight:700; opacity:.85; margin:0 0 6px;}
  .cargo-chip{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px;
    background:var(--p1); border:1px solid rgba(0,0,0,.35);}  /* mirrors P1's train colour */
  .ver{margin-top:12px; text-align:center; font-size:11px; opacity:.4; letter-spacing:.5px;}
  .mini{margin-top:10px; width:100%; background:transparent; border:1px solid rgba(255,255,255,.22);
    color:#fff; opacity:.8; font-size:14px; font-weight:700; padding:11px; border-radius:10px; cursor:pointer;}
  body.one .s2, body.one #pad2, body.one .p2only{display:none;}
</style>
</head>
<body class="one">
<div id="wrap">
  <div id="bar">
    <button id="gear" aria-label="Settings">⚙️</button>
    <div id="scores"><span class="s1">P1 <span id="sc1">0</span></span><span class="s2">P2 <span id="sc2">0</span></span></div>
    <span class="bar-title">🚂 Train Snake</span>
  </div>
  <div id="stage"><div id="board-holder"><canvas id="board"></canvas>
    <div id="count">
      <div id="count-post"></div>
      <div class="glight" id="gl1"></div><div class="glight" id="gl2"></div>
      <div id="count-gate"></div>
      <div id="count-num"></div>
    </div>
  </div></div>
</div>

<div class="pad" id="pad1">
  <button class="up" data-p="1" data-d="up">▲</button>
  <button class="down" data-p="1" data-d="down">▼</button>
  <button class="left" data-p="1" data-d="left">◀</button>
  <button class="right" data-p="1" data-d="right">▶</button>
</div>
<div class="pad" id="pad2">
  <button class="up" data-p="2" data-d="up">▲</button>
  <button class="down" data-p="2" data-d="down">▼</button>
  <button class="left" data-p="2" data-d="left">◀</button>
  <button class="right" data-p="2" data-d="right">▶</button>
</div>
<div id="flash"></div>

<div id="modal">
  <div class="sheet">
    <h2>🚂 Train Snake</h2>
    <p class="sub">P1 = arrow keys · left pad · swipe the board<br>P2 = W A S D · right pad<br>Grab the gold cargo, don't crash!</p>
    <div class="row"><span>Players</span>
      <div class="grp"><button id="m1" class="on">1P</button><button id="m2">2P</button></div></div>
    <div class="row"><span>Speed</span>
      <div class="grp"><button data-tick="240">🐢</button><button data-tick="180" class="on">🚂</button><button data-tick="120">🐇</button></div></div>
    <div class="row col"><span>Cargo <i class="cargo-chip"></i></span>
      <div class="grp wrap">
        <button data-cargo="1" class="on">1</button><button data-cargo="2">2</button><button data-cargo="3">3</button><button data-cargo="4">4</button><button data-cargo="5">5</button><button data-cargo="6">6</button><button data-cargo="7">7</button><button data-cargo="8">8</button><button data-cargo="9">9</button><button data-cargo="10">10</button>
      </div></div>
    <div class="row col"><span>P1 train colour 🚂</span><div class="grp wrap" id="p1colors"></div></div>
    <div class="row col p2only"><span>P2 train colour 🚂</span><div class="grp wrap" id="p2colors"></div></div>
    <div class="row"><span>🔊 Sound FX</span><button id="sfx" class="tog">On</button></div>
    <div class="row"><span>🎵 Music</span><button id="music" class="tog">On</button></div>
    <button id="close">▶ Play</button>
    <button id="resethi" class="mini">Reset best scores</button>
    <div class="ver">build 2026-08-06 · 6</div>
  </div>
</div>

<div id="over">
  <div class="sheet">
    <h2 id="over-title">💥 Crash!</h2>
    <div id="over-score">0</div>
    <div id="over-best"></div>
    <p class="sub" id="over-sub" style="margin-top:0"></p>
    <button id="restart">↻ Restart</button>
    <button id="over-settings" class="mini">⚙️ Settings</button>
  </div>
</div>

<script>
const COLS=25, ROWS=25;
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
let CELL=24;

function fit(){
  // #stage is whatever space is left after the bar and the reserved pad zones (CSS padding),
  // so measuring it keeps the board clear of the touch pads in either orientation.
  const st=document.getElementById('stage');
  const maxW=Math.min(st.clientWidth-6, 660);
  const maxH=st.clientHeight-6;
  CELL=Math.max(10, Math.floor(Math.min(maxW/COLS, maxH/ROWS)));
  cv.width=COLS*CELL; cv.height=ROWS*CELL;
  const cn=document.getElementById('count-num'); if(cn) cn.style.fontSize=Math.round(cv.height*0.26)+'px';  // board-relative
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,150));
fit();

// Haptics. Android/Chrome expose navigator.vibrate. iOS Safari has no Vibration API,
// but clicking a hidden <label> wrapping an <input switch> fires a real system haptic
// on iOS 17.4+ (must happen inside a user gesture — our D-pad taps qualify). Requires
// Safari (Add to Home Screen via Safari) + System Haptics on; Chrome-on-iOS may not fire.
let iosHapLabel=null;
(function(){
  const l=document.createElement('label');
  l.setAttribute('aria-hidden','true');
  // rendered but off-screen (NOT display:none, which can suppress the haptic)
  l.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;';
  const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch','');
  l.appendChild(i); document.body.appendChild(l); iosHapLabel=l;
})();
function haptic(pattern){
  if(navigator.vibrate && navigator.vibrate(pattern)) return; // Android/Chrome
  try{ iosHapLabel.click(); }catch(e){}                       // iOS best-effort (Safari, 17.4+)
}

const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};

function makeTrain(x,y,dir,color,dark){
  return {body:[{x,y},{x:x-DIRS[dir][0],y:y-DIRS[dir][1]},{x:x-2*DIRS[dir][0],y:y-2*DIRS[dir][1]}],
    dir, next:dir, color, dark, score:0, grow:0, acc:0, int:180, boost:false, wasBoost:false, burstT:0, prev:null};
}
let p1,p2,cargos=[],prev;
let mode=1;          // number of players (1 or 2) — starts single-player
let tick=180;        // ms per move; lower = faster
let cargoCount=1;    // how many cargo pickups on the board at once (1–5)
let heldDir={'1':null,'2':null};   // direction key held per player, for boost
let heldSince={'1':0,'2':0};       // when the current held direction began (for the boost hold-delay)
function actives(){ return mode===2 ? [p1,p2] : [p1]; }
function trainInterval(t){ return t.boost ? Math.max(60, tick*0.42) : tick; }  // boost ≈ 2.4× faster while held

function reset(full){
  const s1=(!full&&p1)?p1.score:0, s2=(!full&&p2)?p2.score:0;
  p1=makeTrain(6,7,'right',getVar('--p1'),getVar('--p1d'));
  p2=makeTrain(COLS-7,ROWS-8,'left',getVar('--p2'),getVar('--p2d'));
  p1.score=s1; p2.score=s2;
  setColor('1',colorIdx['1']); setColor('2',colorIdx['2']);   // re-apply chosen colours (incl. rainbow)
  cargos=[]; refillCargo();
  for(const t of [p1,p2]){ t.prev=t.body.map(s=>({...s})); t.acc=0; t.int=tick; t.boost=false; t.wasBoost=false; }
  heldDir={'1':null,'2':null}; heldSince={'1':0,'2':0};
}
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function snapshot(){return {p1:p1.body.map(s=>({...s})), p2:p2.body.map(s=>({...s}))};}

function occupied(x,y){
  return actives().some(t=>t.body.some(s=>s.x===x&&s.y===y)) || cargos.some(c=>c.x===x&&c.y===y);
}
function freeCell(){
  let x,y;
  do{ x=Math.floor(Math.random()*COLS); y=Math.floor(Math.random()*ROWS);}while(occupied(x,y));
  return {x,y};
}
function refillCargo(){ while(cargos.length<cargoCount) cargos.push(freeCell()); }

function setDir(t,d){ if(d!==OPP[t.dir]) t.next=d; }

// input
const KEYMAP={arrowup:['1','up'],arrowdown:['1','down'],arrowleft:['1','left'],arrowright:['1','right'],
             w:['2','up'],s:['2','down'],a:['2','left'],d:['2','right']};
addEventListener('keydown',e=>{
  const m=KEYMAP[e.key.toLowerCase()];
  if(m){ e.preventDefault(); const[p,dir]=m;
    if(heldDir[p]!==dir){ heldDir[p]=dir; heldSince[p]=performance.now(); }   // new hold begins
    setDir(p==='1'?p1:p2,dir); }
});
addEventListener('keyup',e=>{
  const m=KEYMAP[e.key.toLowerCase()];
  if(m){ const[p,dir]=m; if(heldDir[p]===dir) heldDir[p]=null; }   // release → stop boosting
});
document.querySelectorAll('.pad button').forEach(b=>{
  const p=b.dataset.p, dir=b.dataset.d;
  const go=e=>{e.preventDefault(); haptic(14); if(heldDir[p]!==dir){ heldDir[p]=dir; heldSince[p]=performance.now(); } setDir(p==='1'?p1:p2,dir);};
  const rel=()=>{ if(heldDir[p]===dir) heldDir[p]=null; };   // hold to boost, release to stop
  b.addEventListener('touchstart',go,{passive:false}); b.addEventListener('mousedown',go);
  b.addEventListener('touchend',rel); b.addEventListener('touchcancel',rel);
  b.addEventListener('mouseup',rel); b.addEventListener('mouseleave',rel);
});
// swipe on board -> P1
let sx,sy;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  if(sx==null)return; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  haptic(14);
  setDir(p1, Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
  sx=sy=null;
});

function crashFlash(){const f=document.getElementById('flash');f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,60);}

// move ONE train one cell (trains step on independent timers so boost is per-player)
function stepTrain(t){
  t.prev = t.body.map(s=>({...s}));
  t.dir=t.next; const[dx,dy]=DIRS[t.dir];
  t.body.unshift({x:t.body[0].x+dx, y:t.body[0].y+dy});
  if(t.grow>0){t.grow--;} else {t.body.pop();}
  const h=t.body[0];
  // cargo
  const idx=cargos.findIndex(c=>c.x===h.x && c.y===h.y);
  if(idx>=0){ t.grow+=1; t.score++; chime(); haptic(22); cargos.splice(idx,1);
    if(t.score%10===0){ t.burstT=performance.now(); bigToot(); } }   // every +10 cargo → toot + steam (same as game start)
  refillCargo();
  document.getElementById('sc1').textContent=p1.score;
  document.getElementById('sc2').textContent=p2.score;
  // collisions: head vs walls / self / the other active train
  let crash = h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS;
  if(!crash){ let cnt=0;
    for(const tr of actives()) for(const s of tr.body){ if(s.x===h.x&&s.y===h.y && ++cnt>1){ crash=true; } }
  }
  if(crash){ crashFlash(); haptic([50,40,80]); showGameOver(); }
}

// smooth render with interpolation
let acc=0, last=performance.now(); // tick (ms/move) set by the speed control
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const LOADS=['#ffd54f','#81c784','#ff8a65','#ba68c8','#4dd0e1','#f06292'];
function drawWheels(xs,S,HW){ // dark wheels straddling both long edges
  ctx.fillStyle='#1a1a1a';
  xs.forEach(x=>[-1,1].forEach(sg=>{ rr(ctx, x-S*0.09, sg*HW-S*0.06, S*0.18, S*0.12, S*0.05); ctx.fill(); }));
  ctx.fillStyle='rgba(255,255,255,.35)';
  xs.forEach(x=>[-1,1].forEach(sg=>{ ctx.beginPath(); ctx.arc(x, sg*HW, S*0.02,0,7); ctx.fill(); }));
}
function drawLoco(t,S){ // drawn facing +x, centred at origin
  const HL=S*0.46, HW=S*0.32;
  ctx.fillStyle='#e6e6e6'; // cowcatcher
  ctx.beginPath(); ctx.moveTo(HL*0.8,-HW); ctx.lineTo(HL*1.12,0); ctx.lineTo(HL*0.8,HW); ctx.closePath(); ctx.fill();
  drawWheels([-HL*0.45,HL*0.35],S,HW);
  ctx.fillStyle=t.color; rr(ctx,-HL,-HW,HL*1.8,HW*2,S*0.14); ctx.fill(); // boiler
  ctx.fillStyle=t.dark; rr(ctx,-HL,-HW*1.06,HL*0.72,HW*2.12,S*0.10); ctx.fill(); // cab
  ctx.fillStyle='#bbdefb'; rr(ctx,-HL+S*0.06,-HW*0.6,HL*0.44,HW*1.2,S*0.05); ctx.fill(); // window
  ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=Math.max(1,S*0.03); // boiler bands
  [-0.05,0.3].forEach(fx=>{ ctx.beginPath(); ctx.moveTo(HL*fx,-HW); ctx.lineTo(HL*fx,HW); ctx.stroke(); });
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(HL*0.5,0,S*0.12,0,7); ctx.fill(); // smokestack
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(HL*0.5,0,S*0.075,0,7); ctx.fill();
  ctx.fillStyle='#fff59d'; ctx.beginPath(); ctx.arc(HL*0.72,0,S*0.09,0,7); ctx.fill(); // headlight
  ctx.strokeStyle='rgba(255,245,157,.5)'; ctx.stroke();
}
function drawWagon(t,S,i){
  const HL=S*0.40, HW=S*0.30;
  ctx.fillStyle='#3a3a3a'; // couplers reaching toward neighbours
  rr(ctx,HL*0.88,-S*0.035,S*0.22,S*0.07,S*0.02); ctx.fill();
  rr(ctx,-HL*1.1,-S*0.035,S*0.22,S*0.07,S*0.02); ctx.fill();
  drawWheels([-HL*0.5,HL*0.5],S,HW);
  ctx.fillStyle=t.dark; rr(ctx,-HL,-HW,HL*2,HW*2,S*0.10); ctx.fill(); // flat car base
  ctx.fillStyle = t.rainbow ? `hsl(${(performance.now()/10 + i*28 + 45)%360},95%,62%)` : LOADS[(i-1)%LOADS.length];
  rr(ctx,-HL*0.72,-HW*0.72,HL*1.44,HW*1.44,S*0.08); ctx.fill(); // cargo
  ctx.fillStyle='rgba(255,255,255,.28)'; rr(ctx,-HL*0.72,-HW*0.72,HL*1.44,HW*0.55,S*0.06); ctx.fill(); // shine
}
function drawTrain(t,pb,alpha){
  const body=t.body, S=CELL;
  for(let i=body.length-1;i>=0;i--){
    const cur=body[i], old=pb[i]||pb[pb.length-1]||cur;
    const ix=old.x+(cur.x-old.x)*alpha, iy=old.y+(cur.y-old.y)*alpha;
    const cx=ix*S+S/2, cy=iy*S+S/2;
    // each segment faces the way it last moved (follows corners); head falls back to train dir
    let vx=cur.x-old.x, vy=cur.y-old.y, dir;
    if(vx||vy) dir = vx>0?'right':vx<0?'left':vy>0?'down':'up'; else dir=t.dir;
    if(t.rainbow){ const h=(performance.now()/10 + i*28)%360; t.color=`hsl(${h},92%,63%)`; t.dark=`hsl(${h},85%,45%)`; }
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(DIRS[dir][1],DIRS[dir][0]));
    if(i===0) drawLoco(t,S); else drawWagon(t,S,i);
    ctx.restore();
    if(i===0){ // steam puffs rising (screen-up, independent of heading)
      for(let k=0;k<3;k++){
        const life=((performance.now()/650)+k/3)%1;
        ctx.fillStyle=`rgba(225,225,225,${0.4*(1-life)})`;
        ctx.beginPath(); ctx.arc(cx, cy - S*0.2 - life*S*1.1, S*(0.09+life*0.2),0,7); ctx.fill();
      }
      // milestone burst: a huge billowing plume (~3× size) for ~1.4s after each +10 cargo
      if(t.burstT){ const el=performance.now()-t.burstT;
        if(el<1400){ const prog=el/1400;
          for(let k=0;k<10;k++){ const life=(prog+k/10)%1, spread=(k-4.5)*S*0.28;
            ctx.fillStyle=`rgba(255,255,255,${0.6*(1-life)})`;
            ctx.beginPath(); ctx.arc(cx+spread*life, cy - S*0.3 - life*S*3.0, S*(0.34+life*1.05),0,7); ctx.fill();
          }
        }
      }
    }
  }
}

let bodyRB=false;
function rainbowOn(){ return !!((p1&&p1.rainbow) || (mode===2 && p2 && p2.rainbow)); }
function render(){
  const now=performance.now(), RB=rainbowOn();
  if(RB!==bodyRB){ document.body.classList.toggle('rainbow', RB); bodyRB=RB; }  // silly page-wide theme
  if(RB){ // cycle the score / D-pad / title colours for whichever trains are rainbow
    const S=document.documentElement.style;
    if(p1&&p1.rainbow){ const h=(now/12)%360; S.setProperty('--p1',`hsl(${h},90%,62%)`); S.setProperty('--p1d',`hsl(${h},80%,42%)`); }
    if(mode===2&&p2&&p2.rainbow){ const h=(now/12+140)%360; S.setProperty('--p2',`hsl(${h},90%,62%)`); S.setProperty('--p2d',`hsl(${h},80%,42%)`); }
  }
  // board background + grid
  if(RB){                                 // Rainbow Road: animated diagonal rainbow, darkened for contrast
    const base=(now/16)%360, g=ctx.createLinearGradient(0,0,cv.width,cv.height);
    for(let k=0;k<=6;k++) g.addColorStop(k/6, `hsl(${(base+k*60)%360},90%,55%)`);
    ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='rgba(0,0,0,0.30)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle=`hsla(${(base+180)%360},100%,85%,0.30)`;
  } else {
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(255,255,255,.05)';
  }
  ctx.lineWidth=1;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(cv.width,j*CELL);ctx.stroke();}
  // cargo (each pickup bobs on its own phase so they don't pulse in unison)
  const cargoCol = p1.rainbow ? `hsl(${(now/12)%360},90%,62%)` : p1.color, p=CELL*0.16;  // cargo matches P1's train colour
  for(let ci=0;ci<cargos.length;ci++){
    const c=cargos[ci], cx=c.x*CELL, cy=c.y*CELL;
    const bob=Math.sin(now/300 + ci*1.7)*CELL*0.05;
    ctx.fillStyle = cargoCol;
    rr(ctx,cx+p,cy+p+bob,CELL-p*2,CELL-p*2,CELL*0.18); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.fillRect(cx+p, cy+CELL/2-1+bob, CELL-p*2, 2);
    ctx.fillRect(cx+CELL/2-1, cy+p+bob, 2, CELL-p*2);
  }
  drawTrain(p1, p1.prev||p1.body, Math.min(1, p1.acc/(p1.int||tick)));
  if(mode===2) drawTrain(p2, p2.prev||p2.body, Math.min(1, p2.acc/(p2.int||tick)));
}

let paused=false, dead=false;
let counting=false;
function updateBoost(){
  const live = !(paused||dead||counting);
  [['1',p1],['2',p2]].forEach(([pl,t])=>{ if(!t) return;
    // boost only after the key's been held a beat, so a quick tap-to-turn doesn't trigger it
    const b = live && heldDir[pl]!=null && heldDir[pl]===t.dir && (performance.now()-heldSince[pl])>=140;
    if(b && !t.wasBoost) whistle();      // bold toot-toot when a boost begins
    t.boost=b; t.wasBoost=b;
  });
}
function loop(now){
  let dt=now-last; last=now; if(dt>100) dt=100;   // clamp tab-switch gaps
  updateBoost();
  if(!(paused||dead||counting)){
    for(const t of actives()){
      const iv=trainInterval(t); t.int=iv; t.acc+=dt;
      let g=0; while(t.acc>=iv && !dead){ t.acc-=iv; stepTrain(t); if(++g>20){ t.acc=0; break; } }
    }
  }
  render();
  requestAnimationFrame(loop);
}
// ---- Pre-round countdown: a DOM/CSS crossing gate overlay (no canvas ghosting on iOS) ----
let countTimer=null;
const countEl=document.getElementById('count'), countNum=document.getElementById('count-num');
function crossingDing(go){ if(!actx||!sfxOn) return; const t=actx.currentTime;
  if(go){ bell(1046,t,0.5); bell(1046,t+0.13,0.5); }        // bright "go" chime
  else { bell(880,t,0.45); bell(660,t+0.14,0.45); }         // alternating crossing bell: ding-ding
}
function startCountdown(){
  counting=true; clearTimeout(countTimer);
  countEl.classList.add('show');
  requestAnimationFrame(()=>countEl.classList.add('closed'));   // gate lowers (CSS transition)
  const steps=['3','2','1','GO!']; let idx=0;
  (function tick(){
    if(idx<steps.length){
      const go=steps[idx]==='GO!';
      countNum.textContent=steps[idx];
      countNum.classList.remove('pop'); void countNum.offsetWidth; countNum.classList.add('pop');
      if(go){ countEl.classList.remove('closed'); crossingDing(true); bigToot(); }  // gate raises + toot + steam
      else crossingDing(false);
      idx++; countTimer=setTimeout(tick, go?650:720);
    } else {
      countEl.classList.remove('show'); countNum.textContent='';
      counting=false; last=performance.now();
    }
  })();
}

  chuff(t0+0.80, 0.70, 1200, 3200, 0.44);   // long trailing hiss
}
// milestone / game-start signature: the "toot-toot" leads, steam follows underneath (so the toot is heard)
function bigToot(){ whistle(); steamSound(0.24); }
function schedule(){
  const s=SONGS[music.songIdx], E=60/s.bpm/2, horizon=actx.currentTime+0.3;
  const lt=s.leadType||'square', bt=s.bassType||'triangle';
  while(music.lead.i<s.lead.length && music.lead.t<horizon){
    const [n,d]=s.lead[music.lead.i];
    if(n>0) tone(midi(n), music.lead.t, E*d*0.9, lt, 0.13, music.gain, 7);   // detuned = fuller lead
    music.lead.t+=E*d; music.lead.i++;
  }
  while(music.bass.i<s.bass.length && music.bass.t<horizon){
    const [n,d]=s.bass[music.bass.i];
    if(n>0) tone(midi(n), music.bass.t, E*d*0.8, bt, 0.16, music.gain);
    music.bass.t+=E*d; music.bass.i++;
  }
  // whole song scheduled → roll into the next one, continuing from its end time
  if(music.lead.i>=s.lead.length && music.bass.i>=s.bass.length){
    const endT=Math.max(music.lead.t, music.bass.t);
    music.songIdx=(music.songIdx+1)%SONGS.length;
    music.lead={i:0,t:endT}; music.bass={i:0,t:endT};
  }
}
function startMusic(){ if(!actx||music.timer) return; const t0=actx.currentTime+0.06;
  music.songIdx=0; music.lead={i:0,t:t0}; music.bass={i:0,t:t0}; music.timer=setInterval(schedule,25); }
function stopMusic(){ if(music.timer){ clearInterval(music.timer); music.timer=null; } }
function updateMusicBtn(){ const b=document.getElementById('music'); b.textContent=musicOn?'On':'Off'; b.classList.toggle('on',musicOn); }
function updateSfxBtn(){ const b=document.getElementById('sfx'); b.textContent=sfxOn?'On':'Off'; b.classList.toggle('on',sfxOn); }
function setMusic(on){ musicOn=on; updateMusicBtn(); saveSettings(); if(on){ ensureAudio(); startMusic(); } else stopMusic(); }
function setSfx(on){ sfxOn=on; updateSfxBtn(); saveSettings(); }
document.getElementById('music').onclick=()=>setMusic(!musicOn);
document.getElementById('sfx').onclick=()=>setSfx(!sfxOn);
// unlock the audio context on the first user gesture; auto-start music if enabled, so SFX also work
function unlockAudio(){ ensureAudio(); if(musicOn) startMusic(); ['keydown','pointerdown','touchstart'].forEach(ev=>window.removeEventListener(ev,unlockAudio)); }
['keydown','pointerdown','touchstart'].forEach(ev=>window.addEventListener(ev,unlockAudio,{passive:true}));

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// load persisted settings and sync the UI before the first round
function applySettings(){
  const s=loadSettings();
  mode=s.mode; tick=s.tick; cargoCount=s.cargo; colorIdx={'1':s.p1c,'2':s.p2c}; musicOn=s.music; sfxOn=s.sfx;
  document.body.classList.toggle('one', mode===1);
  document.getElementById('m1').classList.toggle('on', mode===1);
  document.getElementById('m2').classList.toggle('on', mode===2);
  document.querySelectorAll('[data-tick]').forEach(x=>x.classList.toggle('on', +x.dataset.tick===tick));
  document.querySelectorAll('[data-cargo]').forEach(x=>x.classList.toggle('on', +x.dataset.cargo===cargoCount));
  buildSwatches('p1colors','1',colorIdx['1']); buildSwatches('p2colors','2',colorIdx['2']);
  setColor('1',colorIdx['1']); setColor('2',colorIdx['2']);
  updateMusicBtn(); updateSfxBtn();
}
applySettings();

newGame();
requestAnimationFrame(loop);
</script>
